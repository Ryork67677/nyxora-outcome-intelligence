[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-v1"
version = "0.1.0"
description = "Evaluation-first technical documentation RAG baseline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "numpy>=2.0,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
local-embeddings = ["sentence-transformers>=3,<6"]
# EMBEDDING_PROVIDER=local-lsa: offline TF-IDF+SVD embedder, no model download.
offline-embeddings = ["scikit-learn>=1.5,<2", "joblib>=1.4"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
ragv1 = "rag_v1.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
