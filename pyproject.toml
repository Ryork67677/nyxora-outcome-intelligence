[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nyxora-outcome-intelligence"
version = "0.1.0"
description = "Reproducible lead analytics and machine-learning system with monitoring and an operational scoring API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Russell York" }]
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
pdf = [
  "pdfplumber>=0.11,<1",
  "pypdf>=6,<7",
  "reportlab>=5,<6",
]

[project.scripts]
nyxora-intel = "nyxora_outcome_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nyxora_outcome_intelligence"]

[tool.pytest.ini_options]
addopts = "-q --cov=nyxora_outcome_intelligence --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/nyxora_outcome_intelligence/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
